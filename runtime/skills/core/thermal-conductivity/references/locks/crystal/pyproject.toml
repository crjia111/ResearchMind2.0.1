[project]
name = "researchmind-crystal"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.6.0","pymatgen==2025.6.14","numpy==2.2.6","pandas>=2.1,<3","scipy>=1.12,<2"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
