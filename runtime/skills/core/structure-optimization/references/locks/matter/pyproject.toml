[project]
name = "researchmind-matter"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ase>=3.23,<4", "mattersim==1.2.2; sys_platform != 'win32'", "torch==2.6.0", "torchvision==0.21.0", "torchaudio==2.6.0", "numpy==2.2.6", "pymatgen==2025.6.14", "phonopy>=2.30,<3", "seekpath>=2.2,<3", "matplotlib>=3.8,<4", "e3nn==0.5.8", "ziglang==0.14.1; sys_platform == 'win32'", "cython>=3,<4; sys_platform == 'win32'", "torch-geometric; sys_platform == 'win32'", "torchmetrics; sys_platform == 'win32'", "torch-ema; sys_platform == 'win32'", "torch-runstats; sys_platform == 'win32'", "deprecated; sys_platform == 'win32'", "loguru; sys_platform == 'win32'", "scikit-learn; sys_platform == 'win32'"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
