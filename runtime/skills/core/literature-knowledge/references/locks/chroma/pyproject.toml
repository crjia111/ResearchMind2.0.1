[project]
name = "researchmind-chroma"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["chromadb>=1,<2","pypdf>=5,<8","python-docx>=1.1,<2","fonttools>=4.58,<5"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
