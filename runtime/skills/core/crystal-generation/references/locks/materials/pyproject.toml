[project]
name = "researchmind-materials"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pymatgen==2025.6.14","numpy==2.2.6"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
